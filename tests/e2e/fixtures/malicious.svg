<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" onload="alert('svg-onload')">
	<script>alert('svg-script')</script>
	<style>path { fill: url(https://example.com/track.svg); }</style>
	<foreignObject width="100" height="100"><div xmlns="http://www.w3.org/1999/xhtml">html</div></foreignObject>
	<image href="https://example.com/remote.png" width="100" height="100"/>
	<a href="javascript:alert('link')"><rect width="10" height="10"/></a>
	<use xlink:href="https://example.com/sprite.svg#icon"/>
	<circle cx="50" cy="50" r="40" fill="black" onclick="alert('click')" style="fill:url(https://example.com/x)"/>
</svg>
